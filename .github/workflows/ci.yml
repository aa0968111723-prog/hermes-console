name: Review checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run check:secrets
      - run: npm audit --omit=dev
      - run: npx playwright install --with-deps chrome
      - run: npm run test:ui
      - run: npm run test:chat
      - run: npm run test:workbench
      - run: npm run test:gateway
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: visual-workspace-browser-evidence
          path: output/playwright
