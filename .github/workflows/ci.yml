name: Review checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run check:secrets
      - run: npm audit --omit=dev
      - name: Install Playwright browsers (chromium + webkit, retry)
        run: |
          set -e
          # Block Google Chrome apt permanently for this job
          sudo rm -f /etc/apt/sources.list.d/google-chrome*.list \
            /etc/apt/sources.list.d/google*.list \
            /etc/apt/sources.list.d/*chrome*.list 2>/dev/null || true
          sudo grep -rl 'dl.google.com/linux/chrome' /etc/apt 2>/dev/null | xargs -r sudo rm -f || true
          sudo rm -f /var/lib/apt/lists/*google* /var/lib/apt/lists/*chrome* || true
          printf '%s\n' 'Package: *' 'Pin: origin dl.google.com' 'Pin-Priority: -1' | sudo tee /etc/apt/preferences.d/no-google-chrome >/dev/null
          sudo apt-get update -y || true
          for i in 1 2 3; do
            sudo rm -f /etc/apt/sources.list.d/google-chrome*.list \
              /etc/apt/sources.list.d/google*.list \
              /etc/apt/sources.list.d/*chrome*.list 2>/dev/null || true
            if npx playwright install-deps chromium \
              && npx playwright install chromium webkit; then
              exit 0
            fi
            echo "playwright install failed (attempt $i); sleeping 15s"
            sleep 15
          done
          exit 1
      - run: npm run test:ui
      - run: npm run test:chat
      - run: npm run test:workbench
      - run: npm run test:gateway
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: visual-workspace-browser-evidence
          path: output/playwright
